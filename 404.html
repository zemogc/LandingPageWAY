<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada · Info Display Solutions</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/LandingPageWAY/assets/img/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Overpass:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #0b0b3d; --cyan: #00ccff; --signal: #ffc61a; --mist: #f3f6fa; color-scheme: light; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--mist); color: var(--ink); font-family: 'Lato', Arial, sans-serif; text-align: center; }
    main { display: grid; gap: 20px; justify-items: center; max-width: 460px; }
    .sign { display: inline-flex; border-radius: 6px; overflow: hidden; font-family: 'Overpass', Arial, sans-serif; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; }
    .sign span { background: var(--ink); color: #fff; padding: 8px 14px 7px; }
    .sign i { font-style: normal; background: var(--signal); padding: 8px 12px 7px; }
    h1 { font-family: 'Overpass', Arial, sans-serif; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
    a { display: inline-block; background: var(--cyan); color: var(--ink); font-weight: 700; padding: 14px 24px; border-radius: 10px; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <span class="sign"><span>Error 404</span><i aria-hidden="true">?</i></span>
    <h1>Esta ruta no lleva a ningún consultorio</h1>
    <p>La página que busca no existe o cambió de lugar.</p>
    <a href="/LandingPageWAY/">Volver al directorio</a>
  </main>
</body>
</html>
